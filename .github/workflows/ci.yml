name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API — линтер, типы, тесты на PostgreSQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Тесты сами поднимают PostgreSQL 18 в контейнере (Testcontainers).
      - run: npm test

  web:
    name: Web — линтер, типы, сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: Запуск с нуля в Docker и сценарии в браузере
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Поднять весь стек так же, как это делает проверяющий
        run: docker compose up --build -d --wait
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Логи контейнеров при сбое
        if: failure()
        run: docker compose logs --no-color
